name: generar snake

on:
  schedule:
    - cron: "0 */12 * * *"   # se regenera cada 12 horas
  workflow_dispatch:          # permite lanzarlo a mano
  push:
    branches: [main]

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generar el svg de la serpiente
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%2322D3EE&color_dots=%230B1220,%231D4ED8,%232563EB,%233B82F6,%2360A5FA

      - name: publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
